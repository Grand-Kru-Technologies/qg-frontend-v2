name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          CI: "true"
      - run: npm run test:ci
      - name: SPA fallback present in build
        run: grep -q 'index.html' build/_redirects
      - if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: qg-frontend-v2
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set on this repo"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Ensure Pages project exists
        run: npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch main || echo "project already exists"
      - id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name qg-frontend-v2 --branch main
      - name: Smoke test deployment URL
        env:
          DEPLOY_URL: ${{ steps.wrangler.outputs.deployment-url }}
        run: |
          echo "deployment: $DEPLOY_URL"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$DEPLOY_URL/" | grep -q '<div id="root">'
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors -w "%{http_code} /about (SPA fallback)\n" "$DEPLOY_URL/about"
